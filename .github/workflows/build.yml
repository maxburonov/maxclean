name: Build Max Clean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build .app + .dmg
        run: zsh build.sh "$(cat .version)"

      # DMG GitHub Releases'ga joylanadi (Actions artifact xotirasi limitiga kirmaydi).
      # Faqat main'ga push bo'lganda yoki qo'lda ishga tushirilganda.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat .version)"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" build/MaxClean-$V.dmg --clobber
          else
            gh release create "v$V" build/MaxClean-$V.dmg --target "$GITHUB_SHA" --title "Max Clean $V" --notes "Max Clean $V — Apple Silicon"
          fi
